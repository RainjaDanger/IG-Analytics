name: Instagram Analytics Sync

on:
  schedule:
    - cron: '0 20 * * 0'  # 6am AEST (UTC+10) every Monday (Sunday 20:00 UTC)
  workflow_dispatch:
    inputs:
      week_start_date:
        description: 'Week start date (YYYY-MM-DD, must be a Monday). Leave empty for current week.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for the keepalive commit

    steps:
      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repo activity
      - name: Keep workflow alive
        if: github.event_name == 'schedule'
        run: |
          days_since=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Days since last commit: $days_since"
          if [ "$days_since" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: prevent scheduled workflow auto-disable"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEEK_START_DATE: ${{ github.event.inputs.week_start_date }}
        run: python src/main.py
